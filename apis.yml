aid: sentrial
name: Sentrial
description: >-
  Sentrial is an observability platform for AI agents, backed by Y Combinator. It tracks every
  agent session, tool call, and LLM interaction, then automatically detects issues, diagnoses root
  causes, and helps teams fix them in code. Developers instrument agents with the Sentrial Python or
  TypeScript SDK (one-line integrations for LangChain, CrewAI, AutoGen, Mastra, the Vercel AI SDK, and
  the Claude Agent SDK), by sending OpenTelemetry traces, or by calling the REST ingestion API
  (https://api.sentrial.com) directly to create sessions and record events. A `sentrial` CLI ships with
  the SDK for local setup, scriptable session/event inspection, diagnosis, and CI regression gates.
